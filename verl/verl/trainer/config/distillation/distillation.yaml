# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.DistillationConfig

# specify the default per-component configs
defaults:

  # <folder_name>@<field_name>.<field_name>: <yaml_file_name>

  # load the default config, then apply the fields in the current yaml
  # self config override anything above
  - _self_

# Whether to enable distillation.
enabled: false

# distillation loss config
distillation_loss:

  # # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.DistillationLossConfig


  # Loss function mode for distillation
  loss_mode: k3

  # If distillation loss requires top-k logits, this is the value of k
  topk: 32

  # Whether to include task rewards alongside distillation loss.
  use_task_rewards: true


  # The coef of the distillation loss when use_task_rewards is true
  distillation_loss_coef: 1.0

  # Optional max clamp value for distillation loss. If null, no clamping is applied.
  loss_max_clamp: null

  # Optional min clamp value for log probabilities for stability, e.g., log q - log p where p or q are very close to zero.
  log_prob_min_clamp: null

  # Whether to incorporate distillation loss as a reward.
  use_policy_gradient: false

  # Name of the policy loss to use when use_policy_gradient is true.
  policy_loss_mode: "vanilla"

  # PPO clipping ratio for policy loss.
  clip_ratio: 0.2

  # Lower bound for PPO clipping ratio.
  clip_ratio_low: 0.2 

  # Upper bound for PPO clipping ratio.
  clip_ratio_high: 0.2


# Number of GPUs per node in the distillation teacher resource pool
n_gpus_per_node: 8

# Number of nodes in the distillation teacher resource pool
nnodes: 0

# multi-teacher configs
teacher_models:

  # Single-teacher config. This entry is popped when other teacher entries are added, so
  # using `teacher_model` as one of several keys silently drops it. For
  # example, the following CLI overrides result in ONLY `teacher_model2` being used:
  #
  # distillation.teacher_models.teacher_model.key=openai/gsm8k
  # distillation.teacher_models.teacher_model.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  #
  # Instead, give the first teacher a different name:
  #
  # +distillation.teacher_models.teacher_model1.key=openai/gsm8k
  # +distillation.teacher_models.teacher_model1.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  teacher_model:
    _target_: verl.workers.config.DistillationTeacherModelConfig
    key: null
    model_path: null
    num_replicas: 0
    inference:
      _target_: verl.workers.config.RolloutConfig
      name: ${oc.select:actor_rollout_ref.rollout.name}
      dtype: ${oc.select:actor_rollout_ref.rollout.dtype}
      gpu_memory_utilization: 0.5
      enforce_eager: true
      cudagraph_capture_sizes: null
      free_cache_engine: true
      data_parallel_size: 1
      expert_parallel_size: 1
      tensor_model_parallel_size: 2
      max_num_batched_tokens: 8192
      max_model_len: null
      max_num_seqs: 1024
      load_format: auto
      engine_kwargs: {}
      limit_images: null
      enable_chunked_prefill: true
      enable_prefix_caching: true
      disable_log_stats: true
      skip_tokenizer_init: true
      prompt_length: ${oc.select:actor_rollout_ref.rollout.prompt_length}
      response_length: ${oc.select:actor_rollout_ref.rollout.response_length}
      temperature: ${oc.select:actor_rollout_ref.rollout.temperature}

# Key to route examples to the appropriate teacher model in multi-teacher setups. Should correspond to a field in the data proto, e.g., task.
teacher_key: data_source

# --- OPD (On-Policy Distillation) FSDP teacher -------------------------------
# Independent of the upstream `teacher_models` block above. Upstream serves
# teachers as vLLM/SGLang inference replicas behind an async teacher loop; OPD
# instead runs a frozen teacher under FSDP and takes an exact forward pass over
# the student's rollout to get per-token log-probs used as a dense reward.
# The two are mutually exclusive: keep `enabled` (above) false when using this.
fsdp_teacher:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.FsdpTeacherConfig

  # Master switch for OPD teacher scoring.
  enabled: false

  # Single-teacher model path. Ignored when `teachers` is non-empty.
  model_path: null

  # MOPD: list of teachers, e.g. [{name: math, path: /path/to/math_teacher}, ...]
  teachers: []

  # MOPD: dataset `ability` value -> teacher name, e.g. {math: math, coding: code}
  ability_to_teacher: {}

  # If true, an unknown or missing `ability` raises instead of falling back.
  strict_routing: false

  # Teacher used when routing does not resolve. Defaults to the first teacher.
  default_teacher: null

  # Teacher forward micro-batch size per GPU.
  micro_batch_size_per_gpu: 24

  # Teacher parameter dtype.
  dtype: bfloat16

  use_remove_padding: true
  use_dynamic_bsz: false
  forward_max_token_len_per_gpu: 32768
  ulysses_sequence_parallel_size: 1

  # FSDP settings for the teacher module. The teacher is forward-only, so
  # offloading params is essentially free.
  fsdp_config:
    param_offload: true
    reshard_after_forward: true
    fsdp_size: -1

  # Temperature applied to teacher logits before taking log-probs.
  teacher_temperature: 1.0

  # K for top-K distillation, used as the TRAINING REWARD: the token reward
  # becomes the (B, T, K) top-K distillation reward instead of the plain
  # per-token reverse KL. 0 disables it.
  log_prob_top_k: 0

  # Candidate set for the top-K reward:
  # only_stu | only_tch | intersection | union | union-intersection
  top_k_strategy: only_stu

  # How top-K candidates are weighted: student_p | teacher_p | none
  reward_weight_mode: student_p

  # KL estimator for the token reward.
  kl_estimator: k1

  # K used for OBSERVABILITY ONLY (0 = off). The student/teacher top-K sets are
  # computed and the agreement metrics (opd/top_k_overlap_ratio,
  # opd/top_k_reward_mean, ...) are logged, but the reward stays the plain
  # reverse KL. Use this to see how much top-K would change the signal before
  # switching a real run to log_prob_top_k. Ignored when log_prob_top_k > 0.
  metric_top_k: 0

  # HuggingFace attention backend. flash_attention_2 needs a matching
  # flash-attn wheel; sdpa is the fallback when that wheel cannot be built.
  attn_implementation: flash_attention_2

  # MOPD anchor: a frozen generator snapshot (b) loaded as a dedicated module
  # on the teacher worker, outside the routed `teachers` list. It produces the
  # per-state terms of the MOPD residual: log b(y_t), G(s)=KL(b||pi_T)(s) and
  # E_b[log b](s); see verl/utils/opd_anchor.py and verl/workers/fsdp_teacher_worker.py.
  anchor:
    _target_: verl.workers.config.AnchorConfig

    # Master switch for the anchor module and its batch fields.
    enabled: false

    # HF path for the anchor's initial weights. null = actor_rollout_ref.model.path
    # (the window-0 snapshot b <- pi_theta0).
    path: null

    # Pull the actor's live weights into the anchor at init and on refresh.
    from_actor: true

    # Global steps between b <- pi_theta re-snapshots; 0 disables refresh.
    refresh_interval: 0

    # Temperature applied to anchor logits; should match the rollout temperature.
    temperature: 1.0

    # Paired teacher+anchor forward granularity; 0 = same as micro_batch_size_per_gpu.
    # The pair transiently holds two (rows, T, V) logits — halve this if memory is tight.
    micro_batch_size_per_gpu: 0

    # Emit anchor_eb_logp = E_b[log pi_theta] inside the actor's forward pass
    # (+1 anchor-class forward per actor micro-batch). Requires
    # use_remove_padding=True, use_fused_kernels=False, and the same
    # ulysses_sequence_parallel_size as the actor.
    expect_in_train: false

    # >0 stores the anchor's top-K ids+log-probs (B,T,K) for the truncated
    # E_b[log pi_theta] alternative. Ablation-only: the missing tail mass biases
    # the residual's per-state constant.
    top_k: 0

# MOPD cross-window replay buffer + P-C priority sampler (paper §4.4 M3).
# Trainer-side only: each fully-scored generation batch joins a buffer holding
# the last `window` fills, and the actor's update batch is re-drawn from it by
# deterministic stratified quota under the P-C priority measure. OFF by
# default — disabled behavior is identical to today.
mopd_replay:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.MopdReplayConfig

  # Master switch for the replay buffer + priority sampler.
  enabled: false

  # Number of most-recent generation batches retained (the "last L windows";
  # v0 generates every step, so one window = one step's scored fill).
  window: 4

  # Priority measure: marginal_absorption (P-C corrected form, demand
  # ~ 1/mu_eff(s) = c0/2H·eta(s) shape) | proportional_G_negcontrol (falsified
  # E19/E20 baseline, demand ~ G(s)) | uniform.
  priority_mode: marginal_absorption

  # Mixture weight on coverage rarity r = 1/(1+n_sampled) vs the priority
  # measure (both normalized to mean 1 over the live buffer); 0 = pure priority.
  coverage_rarity: 0.0

# M4 EOS semantic patch (merged terminal-token class). A base student that
# terminates on <|endoftext|> cannot learn termination from a teacher whose
# terminal mass sits on <|im_end|>: the teacher's eos is never sampled, so the
# sampled-token reward never sees it. The patch declares both ids one semantic
# class E: the rollout stops on any member (pair with
# actor_rollout_ref.rollout.extra_stop_token_ids), and teacher / student /
# anchor log-prob terms are all evaluated under the merged mass
# log p(E) = lse(z_E) - lse(z). OFF by default; requires fsdp_teacher.enabled,
# use_fused_kernels=False, log_prob_top_k=0.
mopd_eos_patch:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.MopdEosPatchConfig

  # Master switch for the merged-class patch.
  enabled: false

  # The merged terminal class E. Ordered, student-native EOS first by
  # convention. For the Qwen pair: [151643 (<|endoftext|>), 151645 (<|im_end|>)].
  # Every member that is not the tokenizer's eos must also appear in
  # actor_rollout_ref.rollout.extra_stop_token_ids or generation can never
  # terminate on it (the trainer validator rejects the gap).
  semantic_eos_token_ids: []
