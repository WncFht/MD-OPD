name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install toolchain
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint:md
