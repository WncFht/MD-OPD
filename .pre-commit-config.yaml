default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.6"
    hooks:
      - id: ruff
        args:
          - "--config=verl/pyproject.toml"
          - "--fix"
          - "--show-fixes"
          - "--output-format=full"
        exclude: ^.*\.(ipynb)$
      - id: ruff-format
        args:
          - "--config=verl/pyproject.toml"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.3.1"
    hooks:
      - id: mypy
        args:
          - "--config-file=verl/pyproject.toml"
