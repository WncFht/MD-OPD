default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.6"
    hooks:
      - id: ruff
        args:
          - "--config=verl/pyproject.toml"
          - "--fix"
          - "--show-fixes"
          - "--output-format=full"
        exclude: ^.*\.(ipynb)$
      - id: ruff-format
        args:
          - "--config=verl/pyproject.toml"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.3.1"
    hooks:
      - id: mypy
        args:
          - "--config-file=verl/pyproject.toml"

  # md 管线：markdownlint --fix 原地修规则 → gfs 链式 "autocorrect --stdin | prettier" 只写 index。
  # verl/ 是 vendored 第三方库，md hook 一律排除。
  # prettier/markdownlint-cli2/gfs 版本以 package.json 为唯一事实源；autocorrect 走 brew。
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 --fix
        entry: ./node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
        exclude: ^verl/
      - id: prettier
        name: autocorrect + prettier (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "autocorrect --stdin | ./node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        types: [markdown]
        exclude: ^verl/
