repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.12.2"
    hooks:
      - id: ruff
        args:
          - "--config=verl/pyproject.toml"
          - "--fix"
          - "--show-fixes"
          - "--output-format=full"
        exclude: ^.*\.(ipynb)$
      - id: ruff-format
        args:
          - "--config=verl/pyproject.toml"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.17.0"
    hooks:
      - id: mypy
        args:
          - "--config-file=verl/pyproject.toml"
